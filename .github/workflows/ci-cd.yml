name: CI/CD Pipeline & Vercel Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Run Test Suite & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8

      - name: Check Python Syntax & Compilation
        run: |
          python -m py_compile app.py data.py google_sheets.py

      - name: Check Flask App Import Integrity
        run: |
          python -c "from app import app; print('Flask application imported cleanly')"

      - name: Code Quality & Syntax Checks (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv

      - name: HTML Template Validation (HTMLHint)
        run: |
          npx --yes htmlhint "**/*.html" --config .htmlhintrc

      - name: Run Unit Test Suite
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p "test_*.py"

  deploy:
    name: Deploy to Vercel Production
    needs: test-and-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
